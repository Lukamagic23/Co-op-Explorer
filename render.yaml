# Render Blueprint: deploys Co-op Explorer as a static site.
# In Render: New > Blueprint > select this repository.
services:
  - type: web
    name: co-op-explorer
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Single-page app: send every path to index.html so deep links and refreshes work.
      - type: rewrite
        source: /*
        destination: /index.html
